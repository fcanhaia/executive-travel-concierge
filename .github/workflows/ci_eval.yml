name: AgentOps Evaluation Gate

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  evaluate-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install package and test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Run Golden Evaluation and 19-Criterion Governance Suite
        env:
          APP_ENV: test
        run: pytest -v
